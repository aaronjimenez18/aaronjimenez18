name: Pacman Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: aaronjimenez18
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            pacman-output/pacman-contribution-graph.svg
            pacman-output/pacman-contribution-graph-dark.svg?palette=github-dark

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pacman-output
          publish_branch: pacman-output
          force_orphan: true
